name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  zig-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2

      - name: Build
        run: zig build

      - name: Run unit tests
        run: zig build test-unit

      - name: Run integration tests
        run: zig build test-integration

  go-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build
        run: go build -o stump-mcp

      - name: Run tests
        run: go test -v ./...

  build-release:
    runs-on: ubuntu-latest
    needs: [zig-test, go-test]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build Zig ReleaseFast
        run: zig build release-fast

      - name: Build Go MCP wrapper
        run: go build -o stump-mcp

      - name: Verify Zig binary
        run: ./zig-out/bin/stump-core --help

      - name: Verify Go binary
        run: ./stump-mcp --help || true
