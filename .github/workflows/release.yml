name: Release

on:
  release:
    types: [created]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-linux
            os: ubuntu-latest
            zig_artifact: stump-core-linux-x86_64
            go_artifact: stump-mcp-linux-x86_64
            goos: linux
            goarch: amd64
          - target: aarch64-linux
            os: ubuntu-latest
            zig_artifact: stump-core-linux-aarch64
            go_artifact: stump-mcp-linux-aarch64
            goos: linux
            goarch: arm64
          - target: x86_64-macos
            os: macos-latest
            zig_artifact: stump-core-macos-x86_64
            go_artifact: stump-mcp-macos-x86_64
            goos: darwin
            goarch: amd64
          - target: aarch64-macos
            os: macos-latest
            zig_artifact: stump-core-macos-aarch64
            go_artifact: stump-mcp-macos-aarch64
            goos: darwin
            goarch: arm64
          - target: x86_64-windows
            os: windows-latest
            zig_artifact: stump-core-windows-x86_64.exe
            go_artifact: stump-mcp-windows-x86_64.exe
            goos: windows
            goarch: amd64

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build Zig release binary
        run: zig build release-fast -Dtarget=${{ matrix.target }}

      - name: Build Go MCP wrapper
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: go build -o ${{ matrix.go_artifact }}

      - name: Rename Zig binary (Unix)
        if: runner.os != 'Windows'
        run: mv zig-out/bin/stump-core ${{ matrix.zig_artifact }}

      - name: Rename Zig binary (Windows)
        if: runner.os == 'Windows'
        run: mv zig-out/bin/stump-core.exe ${{ matrix.zig_artifact }}

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ matrix.zig_artifact }}
            ${{ matrix.go_artifact }}
