name: Release

on:
  release:
    types: [created]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-linux
            os: ubuntu-latest
            artifact: stump-linux-x86_64
          - target: aarch64-linux
            os: ubuntu-latest
            artifact: stump-linux-aarch64
          - target: x86_64-macos
            os: macos-latest
            artifact: stump-macos-x86_64
          - target: aarch64-macos
            os: macos-latest
            artifact: stump-macos-aarch64

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.15.0

      - name: Build release binary
        run: zig build release-fast -Dtarget=${{ matrix.target }}

      - name: Rename binary
        run: mv zig-out/bin/stump ${{ matrix.artifact }}

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.artifact }}
